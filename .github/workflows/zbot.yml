# Runs the bot unattended and keeps its ledger on the `zbot-results` branch.
# Each run resumes from the ledger: on the first run, from results/ on the default
# branch; after that, from the zbot-results branch.
# Scheduled workflows only fire from the repository's default branch.
name: zbot

on:
  schedule:
    # Each successful run starts the next one (last step), so the bot works back to back.
    # This daily run only restarts the chain if it ever stops.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to run (max 5.5; GitHub stops jobs at 6h)"
        default: "5.5"

permissions:
  contents: write
  actions: write   # to start the next run

concurrency:
  group: zbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 358   # GitHub hard limit is 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y -q libarchive-tools   # bsdtar, for the Vietnamese corpus
      - name: Cache corpora and language models
        uses: actions/cache@v4
        with:
          path: |
            data/corpus
            data/lm
          key: lm-v4-${{ hashFiles('scripts/fetch_corpus.py', 'zbot/lm.py', 'zbot/words.py') }}
      - name: Build language models
        run: test -f data/lm/lm5_vi.npz -a -f data/lm/words_en.npz || python -m zbot setup
      - name: Restore previous results
        run: |
          if git fetch origin zbot-results 2>/dev/null; then
            git checkout FETCH_HEAD -- results/ || true
          fi
          wc -l results/ledger.jsonl || true
      - run: python -m pytest -q tests
      - name: Run bot
        id: bot
        # A hypothesis still running at the limit is lost, but everything finished
        # before it is published by the next step.
        timeout-minutes: 340   # 5.5 h of work + a hypothesis already under way
        env:
          # Inputs reach the shell as variables, never pasted into the script text, so a
          # crafted value can't run commands.
          HOURS: ${{ github.event.inputs.hours || '5.5' }}
        run: |
          case "$HOURS" in ''|*[!0-9.]*) echo "hours must be a number, got: $HOURS" >&2; exit 1;; esac
          # Publish progress every 10 minutes so the dashboard shows current work.
          ( while sleep 600; do scripts/ci_publish.sh; done ) &
          publisher=$!
          trap 'kill $publisher 2>/dev/null || true' EXIT
          rc=0
          python -m zbot run --hours "$HOURS" || rc=$?
          # Exit code 3: nothing left to test. The run still succeeded, but the next one
          # would stop at once too, so the chain pauses (see "Start the next run").
          if [ "$rc" = 3 ]; then echo "idle=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$rc"
      - name: Publish results
        if: always()
        run: |
          python -m zbot report   # rewrites STATUS.json with no current test (run is over)
          scripts/ci_publish.sh
      - name: Start the next run
        # Only after a successful run, so a broken setup can't loop; the daily schedule
        # restarts the chain after a failure. Not when the bot ran out of work: each run
        # would end within a minute and start another, without end. Queue a test and use
        # the dashboard's run button, or wait for the daily run. Runs started this way are
        # allowed to start workflows (workflow_dispatch is exempt from the GITHUB_TOKEN
        # restriction).
        if: success() && steps.bot.outputs.idle != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
        run: gh workflow run zbot.yml --ref "$REF" -f hours=5.5
