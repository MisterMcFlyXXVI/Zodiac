# Runs the bot unattended every night and keeps its ledger on the `zbot-results` branch.
# Scheduled workflows only fire from the repository's default branch.
name: zbot

on:
  schedule:
    - cron: "17 7 * * *"   # daily, 07:17 UTC
  workflow_dispatch:
    inputs:
      hours:
        description: "Hours to run"
        default: "5"

permissions:
  contents: write

concurrency:
  group: zbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get install -y -q libarchive-tools   # bsdtar, for the Vietnamese corpus
      - name: Cache language model
        uses: actions/cache@v4
        with:
          path: |
            data/corpus
            data/lm
          key: lm-v2-${{ hashFiles('scripts/fetch_corpus.py', 'zbot/lm.py') }}
      - name: Build language model
        run: test -f data/lm/lm5_vi.npz || python -m zbot setup
      - name: Restore previous results
        run: |
          if git fetch origin zbot-results 2>/dev/null; then
            git checkout FETCH_HEAD -- results/ || true
          fi
      - run: python -m pytest -q tests
      - name: Run bot
        run: python -m zbot run --hours "${{ github.event.inputs.hours || '5' }}"
      - name: Publish results
        run: |
          git config user.name "zbot"
          git config user.email "zbot@users.noreply.github.com"
          git add results/
          git commit -m "zbot results $(date -u +%F)" || exit 0
          git push --force origin HEAD:zbot-results
